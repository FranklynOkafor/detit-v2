name: V2 release ZIP checks

on:
  pull_request:
    paths:
      - 'detit.php'
      - 'readme.txt'
      - 'uninstall.php'
      - 'src/**'
      - 'assets/**'
      - 'tools/build-release.ps1'
      - '.github/workflows/release-package.yml'
  push:
    branches:
      - develop
    paths:
      - 'detit.php'
      - 'readme.txt'
      - 'uninstall.php'
      - 'src/**'
      - 'assets/**'
      - 'tools/build-release.ps1'
      - '.github/workflows/release-package.yml'

jobs:
  package:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - name: Create and verify WordPress release ZIP
        shell: pwsh
        run: ./tools/build-release.ps1
      - name: Confirm archive size and top-level plugin directory
        shell: pwsh
        run: |
          $zip = 'dist/detit-2.0.0.zip'
          if (-not (Test-Path $zip)) { throw 'Release ZIP missing.' }
          Add-Type -AssemblyName System.IO.Compression.FileSystem
          $archive = [System.IO.Compression.ZipFile]::OpenRead((Resolve-Path $zip))
          try {
            $bad = @($archive.Entries | Where-Object {
              $_.FullName -notlike 'detit-product-content-generator-for-woocommerce/*'
            })
            if ($bad.Count -gt 0) { throw 'Files exist outside the single plugin directory.' }
          }
          finally { $archive.Dispose() }
          Write-Host 'ARCHIVE_ROOT_STRUCTURE: PASS'
